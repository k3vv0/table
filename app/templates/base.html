<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)" />
  <title>{% block title %}Table{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css?v={{ asset_version() }}" />
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" href="/static/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Table" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>
<body>
  <header class="top">
    <nav class="tabs" aria-label="Spaces">
      <a href="/"{% if active == 'table' %} class="on" aria-current="page"{% endif %}>Table</a>
      {% if me.person %}
      <a href="/{{ me.person }}"{% if active == me.person %} class="on" aria-current="page"{% endif %}>My plate</a>
      {% else %}
      <a href="/kev"{% if active == 'kev' %} class="on" aria-current="page"{% endif %}>Kev's plate</a>
      {% endif %}
    </nav>
    <span class="who">{{ me.name }}</span>
    {% if me.role == 'person' %}<a class="gear{% if active == 'settings' %} on{% endif %}" href="/settings" aria-label="Settings">Settings</a>{% endif %}
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/sw-register.js?v={{ asset_version() }}" defer></script>
</body>
</html>
